[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agromanch-ai"
version = "0.2.0"
description = "AgroManch AI Content Factory for Indian agriculture — Gemini generation grounded in NotebookLM-verified sources"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agriculture", "notebooklm", "india", "crop-doctor", "agritech", "rag"]
dependencies = [
    "notebooklm-py>=0.7,<1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
browser = ["notebooklm-py[browser]>=0.7,<1.0"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
